<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTC clock</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
  <a class="back" href="../../index.html">&larr; Back to toolbox</a>

  <div class="clock">
    <div class="date" id="date">&nbsp;</div>
    <div class="readout">
      <span class="hm" id="hm">--:--</span>
      <span class="sec" id="sec">--</span>
      <span class="zone">UTC</span>
    </div>
    <div class="meta">
      <div class="iso" id="iso">&nbsp;</div>
      <div id="local">&nbsp;</div>
    </div>
  </div>
</body>
</html>
